<!DOCTYPE html>
<html>
<head>
    <title>Job Portal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 { text-align: center; }
        form {
            width: 500px;
            margin: auto;
            padding: 30px;
            border: 2px solid black;
            background-color: white;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 130px 1fr; 
            gap: 15px; 
            align-items: center;
        }
        label {
            font-weight: bold;
            text-align: left;
        }
        .css {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%; 
            box-sizing: border-box;
        }
        button {
            grid-column: span 2; 
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
        .radio-group {
            display: flex;
            gap: 10px;
        }
    </style>

    <script>
        function validateForm() {
            let email = document.getElementById("email").value;
            let resume = document.getElementById("resume").value;
            let phone = document.getElementById("phone").value; // Fixed ID
            
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            let phonePattern = /^[0-9]{10}$/;
            let filePattern = /\.(pdf|doc|docx)$/i; // Fixed Regex

            if (!email.match(emailPattern)) {
                alert("Invalid email");
                return false;
            }
            if (!phone.match(phonePattern)) {
                alert("Enter a 10-digit phone number");
                return false;
            }
            if (!resume.match(filePattern)) {
                alert("Only PDF/DOC/DOCX allowed");
                return false;
            }
            alert("Form submitted successfully!");
            return true;
        }
    </script>
</head>
<body>

    <h1>JOB APPLICATION FORM</h1>
    <hr>

    <form onsubmit="return validateForm()">
        <label>Name</label>
        <input type="text" id="name" class="css" placeholder="Enter a name" required>

        <label>D.O.B</label>
        <input type="date" id="date" class="css" required>

        <label>Email</label>
        <input type="email" id="email" class="css" placeholder="Email" required>

        <label>Phone No.</label>
        <input type="tel" id="phone" class="css" placeholder="Phone Number" required>

        <label>Password</label>
        <input type="password" id="password" class="css" placeholder="Password" required>

        <label>Gender</label>
        <div class="radio-group">
            <input type="radio" name="gender" value="male" required> Male
            <input type="radio" name="gender" value="female"> Female
        </div>

        <label>Address</label>
        <input type="text" id="address" class="css" placeholder="Address">

        <label>Skills</label>
        <input type="text" id="skill" class="css" placeholder="Skills" required>

        <label>CGPA</label>
        <input type="number" step="0.01" id="cgpa" class="css" placeholder="CGPA" required>

        <label>Qualification</label>
        <input type="text" id="qualification" class="css" placeholder="Qualification" required>

        <label>Experience</label>
        <input type="number" id="experience" class="css" placeholder="Years of Experience" required>

        <label>Resume</label>
        <input type="file" id="resume" class="css" required>

        <button type="submit">Register Account</button>
    </form>

</body>
</html>
